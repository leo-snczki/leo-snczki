name: Retrato pontilhado

# O GitHub não emite nenhum evento quando se troca a foto de perfil, por
# isso não dá para reagir a essa mudança automaticamente. Este workflow só
# corre quando o mandas correr, depois de trocares a foto:
#   Actions -> Retrato pontilhado -> Run workflow
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regerar mesmo que o avatar não tenha mudado'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: retrato
  cancel-in-progress: false

env:
  USER_ID: '79675019'
  SOURCE: assets/portrait/source.jpg
  OUT: assets/portrait/portrait
  FLAGS: --cols 100 --equalize --detail 0.5 --color --reveal --circle

jobs:
  retrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descarregar o avatar atual
        id: avatar
        run: |
          set -euo pipefail
          # s=400 fixo: é o tamanho com que assets/portrait/source.jpg foi gerado,
          # portanto a comparação byte a byte só acusa mudanças reais da foto.
          url="https://avatars.githubusercontent.com/u/${USER_ID}?s=400"
          code=$(curl -sS -L -o /tmp/avatar.jpg -w '%{http_code}' "$url")
          if [ "$code" != "200" ]; then
            echo "::error::o avatar respondeu HTTP $code"; exit 1
          fi
          if [ ! -s /tmp/avatar.jpg ]; then
            echo "::error::o avatar veio vazio"; exit 1
          fi
          novo=$(sha256sum /tmp/avatar.jpg | cut -d' ' -f1)
          antigo=$(sha256sum "$SOURCE" 2>/dev/null | cut -d' ' -f1 || echo ausente)
          echo "novo=$novo"
          echo "antigo=$antigo"
          if [ "$novo" = "$antigo" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "O avatar não mudou. Nada a fazer."
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar o Python e o Pillow
        if: steps.avatar.outputs.mudou == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        if: steps.avatar.outputs.mudou == 'true'
        run: python -m pip install --quiet Pillow

      - name: Gerar o retrato
        if: steps.avatar.outputs.mudou == 'true'
        run: |
          set -euo pipefail
          cp /tmp/avatar.jpg "$SOURCE"
          python scripts/dotify.py "$SOURCE" -o "$OUT" $FLAGS
          test -s "$OUT.svg"
          python -c "import xml.dom.minidom as m; m.parse('$OUT.svg')"

      - name: Fazer commit
        if: steps.avatar.outputs.mudou == 'true'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portrait README.md
          if git diff --cached --quiet; then
            echo "Sem alterações para submeter."
            exit 0
          fi
          git commit -m 'Regenerate dot-matrix portrait from new profile photo'
          git push
